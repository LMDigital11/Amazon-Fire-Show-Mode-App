name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore (if available)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            cat > keystore.properties <<EOF
            storeFile=release.keystore
            storePassword=$KEYSTORE_PASSWORD
            keyAlias=showmode
            keyPassword=$KEYSTORE_PASSWORD
            EOF
            echo "Keystore decoded, release signing enabled"
          else
            echo "No keystore secret found, will build debug APK"
          fi

      - name: Build APK
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Rename APK for consistency
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ShowMode.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ShowMode.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShowMode-apk
          path: ShowMode.apk
          if-no-files-found: error
          retention-days: 30
